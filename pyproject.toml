[project]
name = "zombie-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.3.0",
    "piper-tts==1.8.0",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
